[local]
baseurl = "http:127.0.0.1:4000/v1"
# do not use for actual paid service keys or any services exposed to the WAN!
apiKeyUnsafe = "somekey"
type = "inference"
api = "openai"

[dummy-router]
baseUrl = "https://dummy-router.ai/api/v1"
# recommended usage
apiKeyFile = "api_keys/dummy-router.key"
type = "inference"
api = "openai"

[dummy-inference]
baseUrl = "https://api.dummy-inference.ai/v1"
# recommended usage
apiKeyFile = "api_keys/dummy-inference.key"
type = "inference"
api = "openai"

[dummy-embedding]
baseUrl = "https://dummy-embedding.com/api/v1"
apiKeyFile = "api_keys/dummy-embedding.key"
type = "inference"
api = "openai"

# A search backend (spec §6.1.1 web.search) — NOT an inference endpoint.
# `type` is what keeps it out of chat/embedding/model-list selection.
[dummy-search]
baseUrl = "https://api.dummy-search.example/search"
apiKeyFile = "api_keys/dummy-search.key"
type = "search"
api = "exa"

[broken-provider]
baseUrl = "https://broken-provider.com/api/v1"
apiKeyFile = "api_keys/non-existent.key"
type = "inference"
api = "openai"
